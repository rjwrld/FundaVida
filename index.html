<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FundaVida — Educational management platform demo</title>
    <meta
      name="description"
      content="Courses, attendance, grades and certificates for FundaVida — now a live demo you can explore as any of four roles, entirely in your browser."
    />

    <!-- Social preview. Crawlers (LinkedIn, Slack, WhatsApp, iMessage, X) drop
         relative image URLs, so every URL here is absolute. The card is
         rendered by scripts/derive-images.ts (npm run images:derive). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FundaVida" />
    <meta property="og:url" content="https://fundavida.vercel.app/" />
    <meta
      property="og:title"
      content="FundaVida — the education platform I built for a Costa Rican non-profit"
    />
    <meta
      property="og:description"
      content="Courses, attendance, grades and certificates for FundaVida — now a live demo you can explore as any of four roles, entirely in your browser."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_CR" />
    <meta property="og:image" content="https://fundavida.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="The platform I built for FundaVida — education management for a Costa Rican non-profit. Live demo, 4 roles, EN / ES."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FundaVida — the education platform I built for a Costa Rican non-profit"
    />
    <meta
      name="twitter:description"
      content="Courses, attendance, grades and certificates for FundaVida — now a live demo you can explore as any of four roles, entirely in your browser."
    />
    <meta name="twitter:image" content="https://fundavida.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The platform I built for FundaVida — education management for a Costa Rican non-profit. Live demo, 4 roles, EN / ES."
    />
    <!-- Inline no-FOUC theme bootstrap. The CSP in vercel.json whitelists this
         script by sha256 hash (script-src), so editing its body requires
         regenerating that hash or the theme flash-prevention silently stops. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('fundavida:v1:theme')
          var theme = stored || 'system'
          var resolved =
            theme === 'system'
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme
          if (resolved === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
